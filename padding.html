<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>padding concept</title>
    <style>
        h1{
            padding: 12px;
            text-align: center;
            color: blue;
            border: 2px solid rgb(252, 7, 7);
            margin-top: 2px;
            height: 100px;
            padding-top: 88px;
        }
        img{
            border: 2px solid rgb(252, 7, 7);
            border-radius: 50%;
            height: auto;
            width: 300px;
            box-shadow: 2px 2px 15px rgb(0, 0, 0);
            display: flex;
            justify-self: center;
        }
    </style>
</head>
