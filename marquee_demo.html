<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee</title>
</head>
<body>
    <marquee behavior="scroll" scrollamount="200" direction="right"><p>Welcome</p></marquee>
    <table border="1">
        <tr>
            <td>
                <img src="./Images/profile.jpg" height="100px" width="100px" alt="">
            </td>
            <td>
                <marquee behavior="scroll" direction="down">Welcome</marquee>
            </td>
            <td>
                <img src="./Images/profile.jpg" height="100px" width="100px" alt="">
            </td>
        </tr>
        <tr>
            <td>
                <marquee behavior="scroll" direction="right">Welcome</marquee>
            </td>
            <td>
                <img src="./Images/profile.jpg" height="100px" width="100px" alt="">
            </td>
            <td>
                <marquee behavior="scroll" direction="">Welcome</marquee>
            </td>
        </tr>
        <tr>
            <td>
                <img src="./Images/profile.jpg" height="100px" width="100px" alt="">
            </td>
            <td>
                <marquee behavior="alternative" direction="up">Welcome</marquee>
            </td>
            <td>
                <img src="./Images/profile.jpg" height="100px" width="100px" alt="">
            </td>
        </tr>
    </table>
</body>
</html>
