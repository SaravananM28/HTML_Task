<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Task</title>
    
</head>
<body>
    <div id="box" ></div>
    <button onclick="change()" ondblclick="reset()">Change bg color</button>

    <script>
        let sqr = document.getElementById('box');
        sqr.style.height="100px";
        sqr.style.width="100px";
        sqr.style.backgroundColor="green";

        function change(){
            sqr.style.height="150px";
        sqr.style.width="150px";
        sqr.style.backgroundColor="red";
        sqr.style.transition="2s ease-in"
        }

        function reset(){
            sqr.style.height="100px";
            sqr.style.width="100px";
            sqr.style.backgroundColor="green";
            sqr.style.transition="2s ease-out"
        }
        

        
    </script>
</body>
</html>
