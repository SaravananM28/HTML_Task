<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Fee Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        form {
            width: 350px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        label {
            display: inline-block;
            width: 120px;
            margin-bottom: 15px;
        }

        input {
            padding: 7px;
            width: 180px;
        }

        button {
            padding: 8px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #display {
            text-align: center;
            margin-top: 30px;
            color: green;
        }
    </style>
</head>

<body>

    <form onsubmit="check(event)">

        <label>Course Name:</label>
        <input type="text" id="course">
        <br>

        <label>Course Fee:</label>
        <input type="number" id="fees">
        <br>

        <label>GST (%):</label>
        <input type="number" id="gst">
        <br>

        <label>Discount (%):</label>
        <input type="number" id="discount">
        <br>

        <button type="submit">Submit</button>

    </form>

    <h1 id="display"></h1>

    <script>
        function check(event) {
            event.preventDefault();

            let course = document.getElementById("course").value;
            let fees = Number(document.getElementById("fees").value);
            let gst = Number(document.getElementById("gst").value);
            let discount = Number(document.getElementById("discount").value);

            let display = document.getElementById("display");

            let gstAmount = fees * (gst / 100);

            let total = fees + gstAmount;

            
            let discountAmount = total * (discount / 100);

           
            let finalAmount = total - discountAmount;

            display.innerText =
                "Course: " + course +
                " | Final Fees: ₹" + finalAmount;
        }
    </script>

</body>
</html>
