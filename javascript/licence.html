<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age checker</title>
</head>
<body>
    <script>
        let age = 34;

        if(age > 18){
            let lic = prompt("Do you Have Licence?(Yes|No)");
            if(lic == "yes"){
                document.write("Drive Safe !!")
            }else{
                document.write("Not Eligible to Drive")
            }
        }else{
            document.write("You Need to Wait")
        }
    </script>
</body>
</html>
