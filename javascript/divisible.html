<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisible</title>
</head>
<body>
    <script>
        let a=Number(prompt("Enter the number"));
        if(a%3 == 0){
            document.write("Fizz");
        }
        else{
            document.write("Not Fizz");
        }

        if(a%5 == 0){
            document.write("<br>Bus");
        }
        else{
            document.write("<br>Not Bus");
        }

        if(a%7 == 0){
            document.write("<br>Buzz");
        }
        else{
            document.write("<br>Not Buzz");
        }

        //odd or even
        if(a%2 == 0){
            document.write("<br>Even");
        }
        else{
            document.write("<br>Odd");
        }
        
        //leap year
        if(a%4 == 0 ){
            document.write("<br>Leap Year");
        }
        else{
            document.write("<br>Not Leap Year");
        }
    </script>
</body>
</html>
