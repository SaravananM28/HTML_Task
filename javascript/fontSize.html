<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Size Task</title>
</head>
<body>
    <h1 id="txt">Hello world !!</h1>
    <button onclick="pluse()">A+</button>
    <button onclick="minus()">A-</button>
    <button onclick="reset()">Reset</button>


    <script>
        let num = 32;
        function pluse(){
            let text = document.getElementById('txt');
            num = num +2
            text.style.fontSize=`${num}px`;
        }

        function minus(){
            let text = document.getElementById('txt');
            num = num - 2
            text.style.fontSize=`${num}px`;
        }

        function reset(){
            let text = document.getElementById('txt').style.fontSize="16px"
        }
    </script>
</body>
</html>
