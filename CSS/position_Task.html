<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Task</title>
    <style>
        #out{
            position: relative;
            height: 300px;
            width: 300px;
            background-color: aqua;
        }
        #in{
            position: absolute;
            height: 150px;
            width: 150px;
            background-color: rgb(28, 80, 185);
            top: 60px;
            left: 60px;
        }
        h1{
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>
    <div id="out">
        <div id="in">
            <h1>Welcome</h1>
        </div>
    </div>
</body>
</html>
