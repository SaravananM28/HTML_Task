<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav Task</title>
    <style>
        .outer{
            display: flex;
            justify-content: space-between;
            align-items: center;            
            width: 100%;
            height: 100px;
            background-color: aqua;
        }
        .inner a{
            height: 50px;
            width: 250px;
            padding: 10px;
            text-decoration: none;
            background-color: rgb(26, 130, 221);
            border: 1px solid rgb(255, 255, 255);
            border-radius: 12px;
            color: white;
            transition: 1s ease-in;
        }
        .inner a:hover{
            height: 50px;
            width: 250px;
            padding: 10px;
            text-decoration: none;
            background-color: aliceblue;
            border: 1px solid black;
            border-radius: 12px;
            color: black;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">
            EMS
        </div>
        <div class="inner">
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Contact</a>
        </div>
    </div>
</body>
</html>
